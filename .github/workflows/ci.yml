name: CI

# The fast suite, on every push and pull request. Everything tagged "slow", which
# is the crash fuzzing, the concurrency properties and the multi-level oracle
# runs, is excluded here and runs in .github/workflows/nightly.yml instead.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        run: gradle test --no-daemon --console=plain
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
